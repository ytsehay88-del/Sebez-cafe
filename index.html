<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebez Cafe | Delicious Moments</title>

<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #26352c;
  background: white;
}

header {
  background: #174b35;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  color: #e5bd45;
  font-size: 25px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 7px;
  font-size: 14px;
}

.hero {
  background: linear-gradient(#103b2bd9,#103b2bd9),
  url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1400");
  background-size: cover;
  background-position: center;
  color: white;
  text-align: center;
  padding: 90px 20px;
}

.hero h1 {
  color: #e5bd45;
  font-size: 40px;
}

.hero p { font-size: 18px; }

.btn {
  display: inline-block;
  background: #e5bd45;
  color: #174b35;
  padding: 13px 24px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  margin: 8px;
  border: none;
  cursor: pointer;
}

section {
  padding: 45px 5%;
  text-align: center;
}

h2 {
  color: #174b35;
  font-size: 30px;
}

.intro {
  max-width: 650px;
  margin: auto;
  line-height: 1.8;
}

.menu-section { background: #f7f7f1; }

.category-title {
  color: #b58b1e;
  margin: 40px 0 20px;
  font-size: 25px;
}

/* Swipeable horizontal menu */
.menu-grid {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 250px;
  gap: 20px;
  max-width: 1100px;
  margin: auto;
  padding: 8px 4px 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 15px #00000012;
  text-align: left;
  scroll-snap-align: start;
}

.card img {
  width: 100%;
  height: 155px;
  object-fit: cover;
}

.card-content { padding: 15px; }

.card h3 {
  color: #174b35;
  margin: 0 0 8px;
}

.card p {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
}

.price {
  color: #b58b1e;
  font-weight: bold;
  font-size: 18px;
}

.add-btn {
  background: #174b35;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  margin-top: 10px;
  cursor: pointer;
}

.cart {
  max-width: 750px;
  margin: 35px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 15px #00000015;
  text-align: left;
}

.cart h3 { color: #174b35; }

.cart-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.cart select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.contact {
  background: #174b35;
  color: white;
}

.contact h2 { color: #e5bd45; }

.contact a {
  color: #e5bd45;
  font-weight: bold;
  text-decoration: none;
}

footer {
  background: #103525;
  color: white;
  text-align: center;
  padding: 22px;
}

@media(max-width:600px) {
  .menu-grid { grid-auto-columns: 205px; }
  header { justify-content: center; }
  nav { text-align: center; }
  nav a { display: inline-block; }
  .hero h1 { font-size: 32px; }
  section { padding: 35px 5%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">SEBEZ CAFE</div>
<section id="cart">
  <h2>Your Shopping Cart</h2>

  <div class="cart">
    <h3>Selected Items</h3>
    <div id="cart-items">
      <p>Your cart is empty.</p>
    </div>

    <h3>Total: <span id="cart-total">0</span> ETB</h3>

    <label for="order-type">Choose your order type:</label>
    <select id="order-type">
      <option value="">Select order type</option>
      <option value="Dine-in">Dine-in</option>
      <option value="Takeaway">Takeaway</option>
      <option value="Delivery">Delivery</option>
    </select>

    <button class="btn" onclick="sendOrder()">
      Order on WhatsApp
    </button>

    <button class="btn" onclick="clearCart()">
      Clear Cart
    </button>
  </div>
</section>

<section class="contact" id="contact">
  <h2>Contact Sebez Cafe</h2>

  <p>We would love to hear from you!</p>

  <p>WhatsApp Orders:
    <a href="https://wa.me/251911371615">
      +251911371615
    </a>
  </p>

  <p>Call the Cashier:
    <a href="tel:0910020033">0910020033</a>
  </p>
</section>

<footer>
  <p>© 2026 Sebez Cafe. All Rights Reserved.</p>
  <p>Delicious Moments, Every Day!</p>
</footer>

<script>
let cart = [];

document.querySelectorAll(".add-btn").forEach(button => {
  button.addEventListener("click", function() {
    const name = this.dataset.name;
    const price = Number(this.dataset.price);

    const existing = cart.find(item => item.name === name);

    if (existing) {
      existing.quantity++;
    } else {
      cart.push({
        name: name,
        price: price,
        quantity: 1
      });
    }

    updateCart();
  });
});

function updateCart() {
  const cartItems = document.getElementById("cart-items");
  const totalElement = document.getElementById("cart-total");

  cartItems.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    cartItems.innerHTML = "<p>Your cart is empty.</p>";
  }

  cart.forEach((item, index) => {
    const subtotal = item.price * item.quantity;
    total += subtotal;

    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <span>${item.name} × ${item.quantity}</span>
      <span>${subtotal} ETB</span>
      <button onclick="removeItem(${index})">Remove</button>
    `;

    cartItems.appendChild(div);
  });

  totalElement.textContent = total;
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCart();
}

function clearCart() {
  cart = [];
  updateCart();
}

function sendOrder() {
  if (cart.length === 0) {
    alert("Your cart is empty. Please add some food.");
    return;
  }

  const orderType = document.getElementById("order-type").value;

  if (!orderType) {
    alert("Please select your order type.");
    return;
  }

  let message = "Hello Sebez Cafe! I would like to place an order:\n\n";

  cart.forEach(item => {
    message += item.name + " x " + item.quantity +
      " = " + (item.price * item.quantity) + " ETB\n";
  });

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  message += "\nTotal: " + total + " ETB";
  message += "\nOrder Type: " + orderType;
  message += "\n\nThank you!";

  const whatsappURL =
    "https://wa.me/251911371615?text=" +
    encodeURIComponent(message);

  window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
