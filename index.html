
<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #333;
            text-align: center;
        }
        header {
            background: #174B35;
            color: #D4AF37;
            padding: 35px 15px;
        }

        section {

        }

            background: #442719;
            color: white;
            padding: 20px;

</section>

<section>

    <div class="menu">
        <h3>Ethiopian Coffee</h3>
        <p>Fresh and delicious coffee.</p>
    </div>

    <div class="menu">
        <h3>Tea</h3>
        <p>Enjoy a warm cup of tea.</p>
    </div>

    <div class="menu">
        <h3>Fresh Juice</h3>
        <p>Refreshing natural juice.</p>
    </div>

<footer>

</html>
